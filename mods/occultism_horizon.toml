changelog = "0.10 and 0.11 in one step. Added: Occultism's chalk crafting in all sixteen colours, crusher spirits (in place of the Demonic Altar and its cores, removed), smelter and crystallizer spirits, sixteen possessed creatures, pastes, cursed honey and demonic meat, the otherworld tree, the spirit campfire, and the Dictionary of Spirits with pentacle previews and ritual satchels. Fixed: whole cubes on the dimensional matrix, no see-through floor under the mineshaft, Actuator and wormhole, and ritual pages' text. Includes 0.9.0-alpha.4's security fixes. Same id, namespace and saved worlds as 0.9.0-alpha.4."
